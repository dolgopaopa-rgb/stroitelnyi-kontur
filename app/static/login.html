<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d9ddd8" />
    <meta name="robots" content="noindex" />
    <title>Вход - Строительный контур</title>
    <link rel="manifest" href="/static/manifest.webmanifest?v=20260825-crm-theme-v3" />
    <link rel="icon" type="image/svg+xml" href="/static/assets/d2dom-logo-tile.svg?v=20260825-crm-theme" />
    <link rel="apple-touch-icon" href="/static/assets/g2-logo-192.png" />
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --line: #d9e0e4;
        --text: #172026;
        --muted: #66737c;
        --brand: #226f68;
        --brand-strong: #15544e;
        --danger: #b94646;
        --danger-soft: #f8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .login-card {
        width: min(100%, 390px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 18px 42px rgba(23, 32, 38, 0.08);
      }

      .brand {
        display: grid;
        gap: 6px;
        margin-bottom: 22px;
      }

      .brand strong {
        font-size: 22px;
        line-height: 1.15;
      }

      .brand span {
        color: var(--muted);
        font-size: 14px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 0 12px;
        background: #fff;
        font-size: 16px;
      }

      input:focus {
        border-color: var(--brand);
        outline: 3px solid rgba(34, 111, 104, 0.14);
      }

      .password-field {
        display: grid;
        gap: 8px;
      }

      .password-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 8px;
      }

      .password-tool {
        min-width: 0;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--brand);
        padding: 6px 12px;
        line-height: 1.2;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .password-tool:focus {
        outline: 3px solid rgba(34, 111, 104, 0.14);
      }

      .submit-button {
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
        padding: 0 14px;
      }

      .submit-button:hover,
      .submit-button:focus {
        background: var(--brand-strong);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .install-button {
        width: 100%;
        min-height: 42px;
        margin-top: 12px;
        border: 1px solid #b9d7cc;
        border-radius: 8px;
        background: #f3faf7;
        color: var(--brand-strong);
        padding: 0 12px;
      }

      .status {
        min-height: 20px;
        color: var(--danger);
        font-size: 13px;
        line-height: 1.35;
      }

      .status.info {
        color: var(--muted);
      }

      .status.error {
        background: var(--danger-soft);
        border-radius: 8px;
        padding: 9px 10px;
      }

      @media (max-width: 480px) {
        .login-shell {
          align-items: start;
          padding: 14px;
        }

        .login-card {
          margin-top: 16px;
          padding: 20px;
          box-shadow: none;
        }

        .password-tools {
          grid-template-columns: 1fr;
        }

        .password-tool {
          min-height: 44px;
        }
      }
    </style>
    <link rel="stylesheet" href="/static/crm-theme.css?v=20260825-crm-theme-v4" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="brand">
          <img class="brand-logo" src="/static/assets/d2dom-logo-tile.svg" alt="" />
          <div>
            <strong id="loginTitle">Контур Д²ДОМ</strong>
            <span>Рабочая система компании</span>
          </div>
        </div>

        <form id="loginForm" novalidate>
          <label>
            Логин
            <input name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required />
          </label>

          <label>
            Пароль
            <span class="password-field">
              <input
                id="passwordInput"
                name="password"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                inputmode="text"
                required
              />
              <span class="password-tools" aria-label="Действия с паролем">
                <button class="password-tool" id="passwordToggle" type="button" aria-controls="passwordInput" aria-pressed="false">Показать пароль</button>
                <button class="password-tool" id="passwordPaste" type="button">Вставить пароль</button>
                <button class="password-tool" id="passwordClear" type="button">Очистить</button>
              </span>
            </span>
          </label>

          <p class="status" id="loginStatus" aria-live="polite"></p>
          <button class="submit-button" type="submit">Войти</button>
        </form>
        <button class="install-button" id="loginInstallButton" type="button" hidden>Установить на Android</button>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const nextPath = params.get("next") || "/";
      const form = document.querySelector("#loginForm");
      const passwordInput = document.querySelector("#passwordInput");
      const passwordToggle = document.querySelector("#passwordToggle");
      const passwordPaste = document.querySelector("#passwordPaste");
      const passwordClear = document.querySelector("#passwordClear");
      const status = document.querySelector("#loginStatus");
      const submitButton = form.querySelector('button[type="submit"]');
      const installButton = document.querySelector("#loginInstallButton");
      let deferredInstallPrompt = null;

      function isAndroidDevice() {
        return /Android/i.test(navigator.userAgent || "");
      }

      function isStandaloneApp() {
        const displayMode = typeof window.matchMedia === "function" ? window.matchMedia("(display-mode: standalone)") : null;
        return Boolean((displayMode && displayMode.matches) || window.navigator.standalone === true);
      }

      function syncInstallButton() {
        installButton.hidden = isStandaloneApp() || (!deferredInstallPrompt && !isAndroidDevice());
        installButton.textContent = deferredInstallPrompt ? "Установить на Android" : "Добавить на главный экран";
      }

      function registerServiceWorker() {
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
        navigator.serviceWorker
          .register("/sw.js")
          .then((registration) => {
            if (registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
            registration.addEventListener("updatefound", () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: "SKIP_WAITING" });
                }
              });
            });
            if (typeof registration.update === "function") {
              registration.update().catch(() => undefined);
            }
          })
          .catch(() => undefined);
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        syncInstallButton();
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        syncInstallButton();
        status.textContent = "Контур установлен на устройство.";
        status.className = "status info";
      });

      installButton.addEventListener("click", async () => {
        if (!deferredInstallPrompt) {
          status.textContent = "На Android откройте меню Chrome ⋮ и выберите «Установить приложение» или «Добавить на главный экран».";
          status.className = "status info";
          return;
        }
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice.catch(() => undefined);
        deferredInstallPrompt = null;
        syncInstallButton();
      });

      if (params.get("logged_out")) {
        status.textContent = "Вы вышли. Для продолжения войдите заново.";
        status.className = "status info";
      }

      if (params.get("audit_error")) {
        status.textContent = "Ссылка аудита недействительна или истекла. Запросите новую ссылку.";
        status.className = "status error";
      }

      passwordToggle.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        passwordToggle.textContent = isHidden ? "Скрыть пароль" : "Показать пароль";
        passwordToggle.setAttribute("aria-pressed", String(isHidden));
        passwordInput.focus();
      });

      passwordPaste.addEventListener("click", async () => {
        status.textContent = "";
        status.className = "status";
        passwordInput.focus();
        try {
          if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") {
            throw new Error("clipboard_unavailable");
          }
          const text = await navigator.clipboard.readText();
          if (!text) {
            throw new Error("clipboard_empty");
          }
          passwordInput.value = text.trim();
          passwordInput.dispatchEvent(new Event("input", { bubbles: true }));
          status.textContent = "Пароль вставлен. Можно нажать «Показать пароль» и проверить.";
          status.className = "status info";
        } catch (error) {
          status.textContent = "Если пароль не вставился автоматически, удерживайте палец в поле пароля и выберите «Вставить».";
          status.className = "status info";
        }
      });

      passwordClear.addEventListener("click", () => {
        passwordInput.value = "";
        passwordInput.focus();
        status.textContent = "";
        status.className = "status";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const login = String(data.get("login") || "").trim();
        const password = String(data.get("password") || "").trim();
        if (!login || !password) {
          status.textContent = "Введите логин и пароль.";
          status.className = "status error";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Вхожу...";
        status.textContent = "";
        status.className = "status";

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login, password, next: nextPath }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "Не удалось войти.");
          }
          window.location.href = payload.redirect || "/";
        } catch (error) {
          status.textContent = error.message || "Не удалось войти.";
          status.className = "status error";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Войти";
        }
      });
      syncInstallButton();
      registerServiceWorker();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132126" />
    <meta name="robots" content="noindex" />
    <title>Вход - Строительный контур</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --line: #d9e0e4;
        --text: #172026;
        --muted: #66737c;
        --brand: #226f68;
        --brand-strong: #15544e;
        --danger: #b94646;
        --danger-soft: #f8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .login-card {
        width: min(100%, 390px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 18px 42px rgba(23, 32, 38, 0.08);
      }

      .brand {
        display: grid;
        gap: 6px;
        margin-bottom: 22px;
      }

      .brand strong {
        font-size: 22px;
        line-height: 1.15;
      }

      .brand span {
        color: var(--muted);
        font-size: 14px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 0 12px;
        background: #fff;
      }

      input:focus {
        border-color: var(--brand);
        outline: 3px solid rgba(34, 111, 104, 0.14);
      }

      .password-field {
        position: relative;
      }

      .password-field input {
        padding-right: 90px;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--brand);
        padding: 0 8px;
        transform: translateY(-50%);
      }

      .password-toggle:focus {
        outline: 3px solid rgba(34, 111, 104, 0.14);
      }

      .submit-button {
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
        padding: 0 14px;
      }

      .submit-button:hover,
      .submit-button:focus {
        background: var(--brand-strong);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .status {
        min-height: 20px;
        color: var(--danger);
        font-size: 13px;
        line-height: 1.35;
      }

      .status.info {
        color: var(--muted);
      }

      .status.error {
        background: var(--danger-soft);
        border-radius: 8px;
        padding: 9px 10px;
      }

      @media (max-width: 480px) {
        .login-shell {
          align-items: start;
          padding: 14px;
        }

        .login-card {
          margin-top: 16px;
          padding: 20px;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="brand">
          <strong id="loginTitle">Строительный контур</strong>
          <span>Вход для сотрудников</span>
        </div>

        <form id="loginForm" novalidate>
          <label>
            Логин
            <input name="login" autocomplete="username" required />
          </label>

          <label>
            Пароль
            <span class="password-field">
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
              <button class="password-toggle" id="passwordToggle" type="button" aria-controls="passwordInput" aria-pressed="false">Показать</button>
            </span>
          </label>

          <p class="status" id="loginStatus" aria-live="polite"></p>
          <button class="submit-button" type="submit">Войти</button>
        </form>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const nextPath = params.get("next") || "/";
      const form = document.querySelector("#loginForm");
      const passwordInput = document.querySelector("#passwordInput");
      const passwordToggle = document.querySelector("#passwordToggle");
      const status = document.querySelector("#loginStatus");
      const submitButton = form.querySelector('button[type="submit"]');

      if (params.get("logged_out")) {
        status.textContent = "Вы вышли. Для продолжения войдите заново.";
        status.className = "status info";
      }

      passwordToggle.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        passwordToggle.textContent = isHidden ? "Скрыть" : "Показать";
        passwordToggle.setAttribute("aria-pressed", String(isHidden));
        passwordInput.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const login = String(data.get("login") || "").trim();
        const password = String(data.get("password") || "");
        if (!login || !password) {
          status.textContent = "Введите логин и пароль.";
          status.className = "status error";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Вхожу...";
        status.textContent = "";
        status.className = "status";

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login, password, next: nextPath }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "Не удалось войти.");
          }
          window.location.href = payload.redirect || "/";
        } catch (error) {
          status.textContent = error.message || "Не удалось войти.";
          status.className = "status error";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Войти";
        }
      });
    </script>
  </body>
</html>

services:
  - type: web
    name: stroitelnyi-kontur
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/server.py"
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9

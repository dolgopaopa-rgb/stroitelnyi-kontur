name: Quality Agent

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check quality agent syntax
        run: python -m py_compile tools/kontur_quality_agent.py tools/kontur_agent_suite.py

      - name: Run agent suite
        env:
          KONTUR_URL: https://kontur.derevgroup.ru
          KONTUR_BASIC_USER: ${{ secrets.KONTUR_BASIC_USER }}
          KONTUR_BASIC_PASSWORD: ${{ secrets.KONTUR_BASIC_PASSWORD }}
        run: |
          python tools/kontur_agent_suite.py --url "$KONTUR_URL" | tee "$GITHUB_STEP_SUMMARY"

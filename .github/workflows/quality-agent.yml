name: Quality Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run quality agent
        env:
          KONTUR_URL: https://kontur.derevgroup.ru
          KONTUR_BASIC_USER: ${{ secrets.KONTUR_BASIC_USER }}
          KONTUR_BASIC_PASSWORD: ${{ secrets.KONTUR_BASIC_PASSWORD }}
        run: |
          python tools/kontur_quality_agent.py --url "$KONTUR_URL" | tee "$GITHUB_STEP_SUMMARY"

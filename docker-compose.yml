services:
  app:
    build:
      context: .
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      APP_DATA_DIR: /data
      BACKUP_DIR: /backups
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:-admin}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD:?Set APP_BASIC_AUTH_PASSWORD in .env}
      APP_ACCESS_ACCOUNTS: ${APP_ACCESS_ACCOUNTS:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-7776000}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      APP_DEPLOYED_AT: ${APP_DEPLOYED_AT:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      YANDEX_DISK_TOKEN: ${YANDEX_DISK_TOKEN:-}
      YANDEX_DISK_ROOT: ${YANDEX_DISK_ROOT:-/Stroitelnyi kontur}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      MAX_API_URL: ${MAX_API_URL:-https://platform-api.max.ru}
      MAX_TOKEN: ${MAX_TOKEN:-}
    volumes:
      - app_data:/data
      - ./data/backups:/backups
      - ./qa-artifacts:/srv/stroitelnyi-kontur/qa-artifacts
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:

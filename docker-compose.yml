services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      APP_DATA_DIR: /data
      BACKUP_DIR: /backups
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:-admin}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD:?Set APP_BASIC_AUTH_PASSWORD in .env}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      YANDEX_DISK_TOKEN: ${YANDEX_DISK_TOKEN:-}
      YANDEX_DISK_ROOT: ${YANDEX_DISK_ROOT:-/Stroitelnyi kontur}
    volumes:
      - app_data:/data
      - ./data/backups:/backups
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
